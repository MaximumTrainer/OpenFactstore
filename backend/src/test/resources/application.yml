spring:
  datasource:
    # One in-memory database per Spring test context. The suite has more distinct context
    # configurations than Spring's context cache holds (32), so contexts are evicted and closed;
    # with one shared database, closing a context ran create-drop and emptied the database under
    # every other cached context (#194, seen as "Table not found" in WorkloadIdentityTest).
    url: jdbc:h2:mem:factstore-${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

ledger:
  enabled: true
  type: local

audit:
  hmac-secret: test-secret-for-unit-tests

security:
  enforce-auth: false
  session:
    lifetime-seconds: 3600
    absolute-lifetime-seconds: 43200
    idle-timeout-seconds: 1800

# A real (test-only) signing secret: the service refuses to issue sessions without one,
# which is the point of #156 FR-3.1.
sso:
  jwt:
    secret: test-only-session-signing-secret-long-enough-for-hs256
    issuer: openfactstore-test

factstore:
  # Tests drive the event outbox relay directly rather than racing a scheduler thread (#185).
  scheduling:
    enabled: false
  # Human-readable logs in tests; every other environment defaults to JSON (#185).
  logging:
    format: plain
