name: CI

on:
  push:
    branches: [ main, 'copilot/**' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-workflows:
    name: Lint GitHub Actions Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  monitoring:
    name: Check Prometheus and Alertmanager config
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # #185: the alert rules ship with the repo, so a rule that does not parse must fail the build.
      - name: promtool check config and rules
        run: |
          # prometheus.yml reads the scrape key from a git-ignored file (#205); stand one in.
          printf 'ci-placeholder' > monitoring/secrets/prometheus-scrape-key
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint promtool             prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/monitoring:/etc/prometheus:ro" --entrypoint promtool             prom/prometheus:v2.53.0 check rules /etc/prometheus/alerts/factstore.yml
      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD/monitoring:/etc/alertmanager:ro" --entrypoint amtool             prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: factstore
          POSTGRES_USER: factstore
          POSTGRES_PASSWORD: factstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factstore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build and test
        run: ./gradlew build
      - name: Run Flyway migration tests
        run: ./gradlew migrationTest
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: factstore
          DB_USERNAME: factstore
          DB_PASSWORD: factstore

  terraform-provider:
    name: Terraform Provider Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: terraform/go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit and component tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start dev server
        run: npm run dev &
      - name: Wait for dev server
        run: npx wait-on http://localhost:5173 --timeout 30000
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/public/screenshots/
          if-no-files-found: ignore

  frontend-e2e-enforced:
    # #209: the UI end to end against a real backend with authentication enforced, nothing
    # stubbed. Each role signs in through development sign-in (loopback only: the dev server's
    # proxy reaches the backend from 127.0.0.1).
    name: Frontend E2E (authentication enforced)
    runs-on: ubuntu-latest
    needs: [frontend]
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: factstore
          POSTGRES_USER: factstore
          POSTGRES_PASSWORD: factstore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factstore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend JAR
        working-directory: backend
        run: ./gradlew bootJar -x test --no-daemon -q
      - name: Start backend with authentication enforced
        working-directory: backend
        run: |
          BOOT_JAR=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -1)
          java -jar "$BOOT_JAR" \
            --spring.datasource.url="jdbc:postgresql://localhost:5432/factstore" \
            --spring.datasource.username=factstore \
            --spring.datasource.password=factstore \
            --security.enforce-auth=true \
            --security.dev-login.enabled=true \
            --sso.jwt.secret="$(openssl rand -base64 48)" \
            --vault.enabled=false \
            > /tmp/factstore.log 2>&1 &
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend ready after $((i * 5))s"; exit 0
            fi
            sleep 5
          done
          echo "Backend did not start"; cat /tmp/factstore.log; exit 1
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start dev server
        working-directory: frontend
        run: npm run dev &
      - name: Wait for dev server
        working-directory: frontend
        run: npx wait-on http://localhost:5173 --timeout 30000
      - name: Run enforced E2E tests
        working-directory: frontend
        run: npx playwright test -c playwright.enforced.config.ts
      - name: Backend log on failure
        if: failure()
        run: tail -200 /tmp/factstore.log

  frontend-contract:
    name: Frontend Consumer Contract Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run consumer Pact tests
        run: npm run test:pact
      # The provider test is annotated @PactFolder("../pacts"), so `./gradlew contractTest`
      # verifies against the *committed* file while this job verifies against the freshly
      # generated one. When they drift, local verification silently checks a weaker contract
      # than CI -- which is exactly how a `tags` field went missing from both files unnoticed.
      - name: Check the committed contract is up to date
        working-directory: .
        run: node scripts/check-pact-drift.mjs pacts/factstore-frontend-factstore-backend.json
      - name: Upload frontend pact files
        uses: actions/upload-artifact@v4
        with:
          name: pacts-frontend
          path: pacts/factstore-frontend-factstore-backend.json
          if-no-files-found: error

  cli-contract:
    name: CLI Consumer Contract Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run consumer Pact tests
        run: npm run test:pact
      # The provider test is annotated @PactFolder("../pacts"), so `./gradlew contractTest`
      # verifies against the *committed* file while this job verifies against the freshly
      # generated one. When they drift, local verification silently checks a weaker contract
      # than CI -- which is exactly how a `tags` field went missing from both files unnoticed.
      - name: Check the committed contract is up to date
        working-directory: .
        run: node scripts/check-pact-drift.mjs pacts/factstore-cli-factstore-backend.json
      - name: Upload CLI pact files
        uses: actions/upload-artifact@v4
        with:
          name: pacts-cli
          path: pacts/factstore-cli-factstore-backend.json
          if-no-files-found: error

  backend-contract:
    name: Backend Provider Contract Verification
    runs-on: ubuntu-latest
    needs: [ frontend-contract, cli-contract ]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Download frontend pact files
        uses: actions/download-artifact@v4
        with:
          name: pacts-frontend
          path: pacts/
      - name: Download CLI pact files
        uses: actions/download-artifact@v4
        with:
          name: pacts-cli
          path: pacts/
      - name: Run provider Pact verification
        run: ./gradlew contractTest
