global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (#185). Paths are relative to this file; docker-compose mounts
# monitoring/alerts at /etc/prometheus/alerts.
rule_files:
  - alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'factstore-command'
    static_configs:
      - targets: ['backend-command:8080']
    metrics_path: '/actuator/prometheus'
    # A key carrying only metrics:read (#205), written by scripts/bootstrap-env.sh.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/prometheus-scrape-key

  - job_name: 'factstore-query'
    static_configs:
      - targets: ['backend-query:8080']
    metrics_path: '/actuator/prometheus'
    # A key carrying only metrics:read (#205), written by scripts/bootstrap-env.sh.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/prometheus-scrape-key
