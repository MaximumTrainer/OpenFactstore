# Alertmanager routing for Factstore alerts (#185).
#
# Two routes, by the severity label every Factstore rule carries:
#   page  -> the on-call receiver, sent immediately and repeated hourly until resolved
#   warn  -> the team channel, grouped and repeated every 12 hours
#
# No receiver address is committed. Each receiver reads its webhook URL from a file, mounted
# from your secret store (Kubernetes Secret, Vault Agent, Docker secret) at the path below.
# Point the page webhook at your paging provider's Events/Alert API (PagerDuty, Opsgenie) or
# any webhook bridge; point warn at a Slack or Teams incoming webhook.
global:
  resolve_timeout: 5m

route:
  receiver: warn
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers: ['severity="page"']
      receiver: page
      group_wait: 0s
      repeat_interval: 1h
    - matchers: ['severity="warn"']
      receiver: warn

# While a service is paging, hold back its warnings: they are usually symptoms of the same fault.
inhibit_rules:
  - source_matchers: ['severity="page"']
    target_matchers: ['severity="warn"']
    equal: ['service']

receivers:
  - name: page
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/page-webhook-url
        send_resolved: true
  - name: warn
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/warn-webhook-url
        send_resolved: true
